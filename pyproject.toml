[project]
name = "thepower-produccion-ia"
version = "0.1.0"
description = "Laboratorio docente de producción de IA: base común, S16 y S17"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.143.3", "httpx==0.28.1", "pydantic==2.14.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
aws = ["boto3==1.43.114"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "cfn-lint==1.57.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curso_ia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".build", "material/*/fuentes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

