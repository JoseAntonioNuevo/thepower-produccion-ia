AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  S18 (2 de 2): entorno de staging. Servicio pequeno en ECS/Fargate con la imagen fijada
  por digest, logs en CloudWatch, panel de errores y latencia, alarma y rol OIDC que solo
  puede desplegar desde el environment staging de GitHub. Sin balanceador, NAT ni base de datos.

Parameters:
  Lab:
    Type: String
    AllowedPattern: "s18-[a-z0-9-]{3,30}"
    Description: El mismo nombre usado en 01-registro-y-publicacion.yaml.
  ImageUri:
    Type: String
    AllowedPattern: ".+@sha256:[a-f0-9]{64}"
    Description: Imagen inicial, siempre por digest (repo@sha256:...), nunca por etiqueta.
  SubDesplegar:
    Type: String
    AllowedPattern: "repo:[^*?]+:environment:staging"
    Description: >-
      Valor exacto del claim «sub» de un job con «environment: staging». Copialo del workflow
      «Diagnostico · OIDC». Formato clasico: repo:ORG/REPO:environment:staging; con
      identificadores: repo:ORG@111/REPO@222:environment:staging. No admite comodines.
  AllowedCidr:
    Type: String
    AllowedPattern: "([0-9]{1,3}\\.){3}[0-9]{1,3}/32"
    Description: Tu IPv4 publica con /32. Es la unica entrada permanente al puerto 8000.
  ApiMode:
    Type: String
    AllowedValues: ["demo", "real"]
    Default: "demo"
    Description: demo usa reglas y no cuesta; real llama al modelo y necesita SecretArn.
  SecretArn:
    Type: String
    # Valor de relleno: con ApiMode=demo no se usa ni se concede permiso sobre el.
    Default: "arn:aws:secretsmanager:eu-north-1:000000000000:secret:no-usado-en-modo-demo"
    AllowedPattern: "arn:aws:secretsmanager:.+"
    Description: Solo con ApiMode=real. ARN del secreto de Secrets Manager con la clave del proveedor.
  ModelId:
    Type: String
    Default: "openai/gpt-6-luna"
    MinLength: 1
    MaxLength: 160
    Description: Modelo de staging (solo se usa con ApiMode=real). Es configuracion, no codigo.

Conditions:
  ModoReal: !Equals [!Ref ApiMode, "real"]

Rules:
  ModoRealNecesitaSecreto:
    RuleCondition: !Equals [!Ref ApiMode, "real"]
    Assertions:
      - Assert: !Not [!Equals [!Ref SecretArn, "arn:aws:secretsmanager:eu-north-1:000000000000:secret:no-usado-en-modo-demo"]]
        AssertDescription: ApiMode=real requiere SecretArn.

Resources:
  # ------------------------------------------------------------------ red
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.218.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref Lab
  Gateway:
    Type: AWS::EC2::InternetGateway
  Conexion:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Gateway
  Subred:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.218.0.0/25
      MapPublicIpOnLaunch: false
  TablaRutas:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  RutaInternet:
    Type: AWS::EC2::Route
    DependsOn: Conexion
    Properties:
      RouteTableId: !Ref TablaRutas
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  Asociacion:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subred
      RouteTableId: !Ref TablaRutas
  Firewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: S18 staging. Entrada solo desde una IPv4 /32; salida solo TLS.
      # El workflow de despliegue anade una regla temporal para la IP de su runner y la
      # retira al terminar. El puerto nunca queda abierto a Internet.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref AllowedCidr
          Description: profesor
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: ECR, CloudWatch, Secrets Manager y proveedor de IA

  # ----------------------------------------------------------------- logs
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/thepower/${Lab}"
      RetentionInDays: 7

  # Los logs son lineas JSON. Estos filtros convierten cada linea «peticion» en metricas
  # sin instalar ningun agente: es la monitorizacion minima de la clase.
  MetricaPeticiones:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      # Solo el endpoint de IA: las comprobaciones de salud no cuentan como trafico.
      FilterPattern: '{ $.evento = "peticion" && $.ruta = "/clasificar" }'
      MetricTransformations:
        - MetricNamespace: !Sub "ThePower/${Lab}"
          MetricName: Peticiones
          MetricValue: "1"
          Unit: Count
  MetricaErrores:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '{ $.evento = "peticion" && $.estado >= 500 }'
      MetricTransformations:
        - MetricNamespace: !Sub "ThePower/${Lab}"
          MetricName: Errores5xx
          MetricValue: "1"
          Unit: Count
  MetricaDuracion:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '{ $.evento = "peticion" && $.ruta = "/clasificar" }'
      MetricTransformations:
        - MetricNamespace: !Sub "ThePower/${Lab}"
          MetricName: DuracionMs
          MetricValue: "$.duracion_ms"
          Unit: Milliseconds

  Panel:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref Lab
      DashboardBody: !Sub |
        {
          "start": "-PT1H",
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "Peticiones a /clasificar y errores 5xx por minuto", "region": "${AWS::Region}",
              "view": "timeSeries", "stacked": false, "period": 60, "stat": "Sum",
              "metrics": [
                ["ThePower/${Lab}", "Peticiones", {"label": "Peticiones"}],
                ["ThePower/${Lab}", "Errores5xx", {"label": "Errores 5xx", "color": "#d62728"}]
              ]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "Duracion de /clasificar (ms)", "region": "${AWS::Region}",
              "view": "timeSeries", "stacked": false, "period": 60,
              "metrics": [
                ["ThePower/${Lab}", "DuracionMs", {"stat": "p50", "label": "p50"}],
                ["ThePower/${Lab}", "DuracionMs", {"stat": "p95", "label": "p95"}]
              ]}},
            {"type": "log", "x": 0, "y": 6, "width": 24, "height": 8, "properties": {
              "title": "Ultimos errores: request_id, version y causa", "region": "${AWS::Region}",
              "view": "table",
              "query": "SOURCE '/thepower/${Lab}' | fields @timestamp, evento, version, ruta, estado, error, error_tipo, request_id\n| filter nivel = \"ERROR\"\n| sort @timestamp desc\n| limit 20"}}
          ]
        }

  # Ampliacion opcional del ejercicio: una alerta automatica. Sin destinatario: se ve en la
  # consola. Para recibir un aviso, anade un tema de SNS en AlarmActions.
  AlarmaErrores:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Lab}-errores-5xx"
      AlarmDescription: Al menos una respuesta 5xx de la API de staging en un minuto.
      Namespace: !Sub "ThePower/${Lab}"
      MetricName: Errores5xx
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Sin peticiones no hay dato, y eso no es un error.
      TreatMissingData: notBreaching

  # ---------------------------------------------------- roles de la tarea
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lo usa ECS para arrancar el contenedor (leer la imagen, escribir logs, leer el secreto).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: arranque-contenedor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Lab}"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt Logs.Arn
              - !If
                - ModoReal
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref SecretArn
                - !Ref AWS::NoValue
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Identidad de la aplicacion en marcha. No tiene permisos; la API no llama a AWS.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # ------------------------------------------------------------ servicio
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref Lab
  Tarea:
    Type: AWS::ECS::TaskDefinition
    # El workflow registra revisiones nuevas de esta familia. Si se actualizara el stack,
    # CloudFormation volveria a la imagen del parametro ImageUri.
    Properties:
      Family: !Ref Lab
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          User: "10001:10001"
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          # Configuracion de staging, fuera del codigo. APP_VERSION no se fija aqui: va
          # dentro de la imagen (el commit con el que se construyo).
          Environment:
            - Name: API_MODE
              Value: !Ref ApiMode
            - Name: OPENROUTER_MODEL
              Value: !Ref ModelId
          # El secreto no esta en la plantilla ni en la imagen: ECS lo lee al arrancar.
          Secrets: !If
            - ModoReal
            - - Name: OPENROUTER_API_KEY
                ValueFrom: !Ref SecretArn
            - !Ref AWS::NoValue
          HealthCheck:
            Command:
              - CMD
              - python
              - -c
              - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
              mode: non-blocking
              max-buffer-size: 1m
  Servicio:
    Type: AWS::ECS::Service
    DependsOn: [RutaInternet, Asociacion]
    Properties:
      ServiceName: !Ref Lab
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Tarea
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: "1.4.0"
      DeploymentConfiguration:
        # Despliegue sin corte: arranca la tarea nueva (200 %), espera a que este sana y
        # solo entonces para la anterior (nunca baja del 100 %).
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # Si la tarea nueva no llega a estar sana, ECS vuelve sola a la revision anterior.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref Subred]
          SecurityGroups: [!Ref Firewall]

  # ------------------------------------------------ rol de despliegue OIDC
  RolDesplegar:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions despliega en staging solo desde el environment staging.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # El «sub» nombra el environment, no la rama: GitHub solo lo emite si el job
              # declara «environment: staging» y cumple las reglas de ese entorno.
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Ref SubDesplegar
      Policies:
        - PolicyName: desplegar-staging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LeerLaImagenPublicada
                Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Lab}"
              - Sid: LeerYActualizarSoloEsteServicio
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Ref Servicio
              - Sid: RegistrarRevisionesDeEstaFamilia
                Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Lab}:*"
              - Sid: LeerTareasDeEsteCluster
                Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Lab}/*"
              - Sid: ListarTareasDeEsteCluster
                Effect: Allow
                Action: ecs:ListTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    "ecs:cluster": !GetAtt Cluster.Arn
              # Estas lecturas no admiten limitar el recurso.
              - Sid: LecturasSinRecurso
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroupRules
                Resource: "*"
              # Solo puede entregar a ECS los dos roles de esta tarea, no otros.
              - Sid: EntregarLosRolesDeLaTarea
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": ecs-tasks.amazonaws.com
              # Regla temporal del smoke: solo en el grupo de seguridad de este servicio.
              - Sid: AbrirYCerrarElPuertoDelSmoke
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${Firewall}"
      Tags:
        - Key: Project
          Value: thepower-s18
        - Key: Lab
          Value: !Ref Lab

Outputs:
  Cluster:
    Description: Variable ECS_CLUSTER del environment staging.
    Value: !Ref Cluster
  Service:
    Description: Variable ECS_SERVICE del environment staging.
    Value: !GetAtt Servicio.Name
  SecurityGroup:
    Description: Variable ECS_SECURITY_GROUP del environment staging.
    Value: !Ref Firewall
  RolDesplegarArn:
    Description: Variable AWS_ROLE_DESPLEGAR del environment staging.
    Value: !GetAtt RolDesplegar.Arn
  LogGroup:
    Value: !Ref Logs
  Panel:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Lab}"
  ImagenInicial:
    Value: !Ref ImageUri
